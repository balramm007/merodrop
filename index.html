
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeroDrop - P2P File Sharing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: '#3d82f6',
            surface: '#202124',
            black: '#000000'
          },
          animation: {
            'ripple': 'ripple 3s cubic-bezier(0, 0.2, 0.8, 1) infinite',
          },
          keyframes: {
            ripple: {
              '0%': { transform: 'scale(0.5)', opacity: '1' },
              '100%': { transform: 'scale(2.5)', opacity: '0' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000000; color: #ffffff; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #3c4043; border-radius: 3px; }
    .radar-line { border: 1px solid rgba(255, 255, 255, 0.08); }
    .peer-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
